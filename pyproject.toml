[project]
name = "pydata-app"
version = "0.0.1"
description = "Deconstructed notebook for the PyData London 2026 talk"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "xorq>=0.3.8",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "sse-starlette>=2.1",
    "tomli-w>=1.0",
]

[project.scripts]
pydata = "pydata_cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pydata_core",
    "src/pydata_xorq",
    "src/pydata_mcp",
    "src/pydata_companion",
    "src/pydata_cli",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:xorq.ibis_yaml.translate",
]
