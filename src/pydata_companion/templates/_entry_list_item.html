<li class="{% if e.alias %}named{% if not e.is_current %} forensic{% endif %}{% else %}scratch{% endif %}">
  <a href="/catalog/{{ e.content_hash }}">
    {% if e.alias %}
      <span class="alias">
        {{ e.alias }}{% if e.version %} <span class="vchip">V{{ e.version }}</span>{% endif %}
        {% if not e.is_current %}<span class="forensic-tag">forensic</span>{% endif %}
      </span>
    {% else %}
      <span class="hash">{{ e.content_hash }}</span>
    {% endif %}
    <span class="prompt">{{ e.prompt or "(no prompt)" }}</span>
    <span class="meta">{{ e.row_count }} rows · {{ e.execute_seconds }}s</span>
  </a>
</li>
