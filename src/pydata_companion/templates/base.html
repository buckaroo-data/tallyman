<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}pydata · {{ project }}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161922;
      --line: #232838;
      --fg: #e6e8ef;
      --muted: #8b93a7;
      --accent: #6ea8fe;
      --accent-soft: #1e2a44;
    }
    html, body { background: var(--bg); color: var(--fg); margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace; }
    body { font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
    header .brand { font-weight: 600; }
    header .project { color: var(--muted); }
    header nav a { margin-right: 12px; }
    main { padding: 16px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 60px); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: auto; }
    .entry-list { list-style: none; margin: 0; padding: 0; }
    .entry-list li { border-bottom: 1px solid var(--line); }
    .entry-list a { display: block; padding: 10px 12px; color: var(--fg); }
    .entry-list a:hover { background: var(--accent-soft); }
    .entry-list .hash { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
    .entry-list .prompt { display: block; margin-top: 2px; }
    .detail { padding: 16px; }
    .detail h2 { margin-top: 0; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    pre.code { background: #0a0c12; border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; }
    table.data-table { border-collapse: collapse; width: 100%; font-size: 12px; }
    table.data-table th, table.data-table td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    table.data-table th { background: #0a0c12; position: sticky; top: 0; }
    .pill { display: inline-block; padding: 2px 6px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 11px; margin-right: 6px; }
    .live { color: var(--accent); }
    .error-banner { background: #2a1b1b; border: 1px solid #5a3a3a; color: #ffb4b4; padding: 10px 12px; border-radius: 4px; margin: 0 16px 12px; }
    .error-banner ul { margin: 6px 0 0 0; padding-left: 20px; }
    .error-banner code { color: #ffd1d1; }
    .entry-list .alias { font-weight: 600; color: var(--fg); display: block; }
    .entry-list .vchip { background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-left: 4px; }
    .entry-list .forensic-tag { background: #333; color: var(--muted); padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; }
    .entry-list li.forensic a { opacity: 0.65; }
    .entry-list li.scratch .hash { color: var(--muted); }
    .entry-list li.current { background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .entry-list li.current a { color: var(--fg); }
    .entry-list li.current.forensic a { opacity: 1; }
    .entry-list li.current .alias { color: var(--accent); }
    .forensic-history { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; margin-top: 12px; }
    .forensic-history ol { margin: 4px 0 0 0; padding-left: 20px; }
    .forensic-history .current { color: var(--accent); font-weight: 500; }
    .dag { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; overflow: auto; }
    .dag .node-box { fill: var(--panel); stroke: var(--line); }
    .dag .node-box.named { stroke: var(--accent); }
    .dag .node-box.root { stroke: var(--accent); fill: var(--accent-soft); }
    .dag .node-label { fill: var(--fg); font-family: ui-monospace, monospace; font-size: 11px; }
    .dag .node-sublabel { fill: var(--muted); font-family: ui-monospace, monospace; font-size: 10px; }
    .dag .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; opacity: 0.7; }
    .dag a:hover .node-box { stroke: var(--accent); }
    .dag-empty { color: var(--muted); padding: 12px; }
    .nb-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 14px 16px; }
    .nb-cell .nb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .nb-cell .nb-drag { cursor: grab; color: var(--muted); user-select: none; font-size: 14px; padding: 0 4px; }
    .nb-cell .nb-drag:active { cursor: grabbing; }
    .sortable-ghost { opacity: 0.4; }
    .sortable-chosen { box-shadow: 0 0 0 2px var(--accent); }
    .nb-cell .nb-head .alias { font-weight: 600; }
    .nb-cell .nb-head .nb-actions { margin-left: auto; display: flex; gap: 6px; }
    .nb-cell .nb-head button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-family: inherit; }
    .nb-cell .nb-head button:hover { color: var(--fg); border-color: var(--accent); }
    .nb-cell .nb-markdown { color: var(--muted); margin: 4px 0 10px; white-space: pre-wrap; }
    .nb-cell .nb-markdown-edit { width: 100%; min-height: 60px; background: #0a0c12; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 12px; }
    .nb-cell .nb-preview { overflow: auto; max-height: 240px; }
    .nb-cell .nb-meta { color: var(--muted); font-size: 11px; margin-top: 8px; }
    .nb-empty { color: var(--muted); padding: 16px; }
    .vega-embed { background: #fff; border-radius: 4px; padding: 8px; min-height: 200px; }
    /* Buckaroo React embed: background matches the widget's dark theme so
       there's no white flash between mount and first WebSocket payload. */
    .buckaroo-embed { background: #181d1f; }
    .edit-code-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit; margin-left: 8px; }
    .edit-code-btn:hover { color: var(--fg); border-color: var(--accent); }
    .section-header { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; padding: 10px 12px 4px; border-top: 1px solid var(--line); }
    .section-header:first-child { border-top: 0; }
  </style>
  <link rel="stylesheet" href="/static/buckaroo-embed.css">
  <script type="module" src="/static/buckaroo-embed.js"></script>
</head>
<body>
  <header>
    <span class="brand">pydata</span>
    <span class="project">project: {{ project }}</span>
    <nav>
      <a href="/catalog">catalog</a>
      <a href="/notebook">notebook</a>
      <a href="/lineage">lineage</a>
    </nav>
    {% if read_only %}<span class="pill" style="color: var(--muted)">read-only · serve mode</span>{% endif %}
    <span id="sse-status" class="pill">connecting…</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const status = document.getElementById('sse-status');
    const sse = new EventSource('/api/sse');
    sse.addEventListener('hello', () => { status.textContent = 'live'; status.classList.add('live'); });
    sse.addEventListener('ping', () => {});
    sse.addEventListener('new_entry', (e) => {
      const data = JSON.parse(e.data);
      const path = window.location.pathname;
      if (path === '/catalog') {
        // Refresh the index so the new entry appears.
        window.location.reload();
      } else if (path.startsWith('/catalog/')) {
        // Already viewing a specific entry — focus the new one.
        window.location.assign('/catalog/' + data.hash);
      }
      // Other tabs (/notebook, /lineage, /diff): don't yank the user.
    });
    sse.addEventListener('build_failed', () => {
      // Reload the current page so the failure banner re-renders.
      // (No-op on tabs that don't show the banner; cheap either way.)
      window.location.reload();
    });
    sse.addEventListener('notebook_changed', () => {
      if (window.location.pathname === '/notebook') window.location.reload();
    });
    sse.addEventListener('chart_attached', (e) => {
      const data = JSON.parse(e.data);
      // Reload only if we're viewing the entry the chart was attached to.
      const path = window.location.pathname;
      if (path === '/catalog/' + data.hash) window.location.reload();
    });
    sse.onerror = () => { status.textContent = 'offline'; status.classList.remove('live'); };

    // SPA-lite navigation: intercept clicks on /catalog/<hash> links and
    // swap only the sidebar + detail regions, avoiding the full-page
    // chrome flash. Falls through to a real navigation if the target
    // page doesn't include both swap regions (e.g. a /lineage page).
    async function spaNavigate(url, push) {
      try {
        const resp = await fetch(url, {headers: {'X-Requested-With': 'pydata-spa'}});
        if (!resp.ok) { window.location.assign(url); return; }
        const html = await resp.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const newSidebar = doc.getElementById('catalog-sidebar');
        const newDetail = doc.getElementById('catalog-detail');
        const oldSidebar = document.getElementById('catalog-sidebar');
        const oldDetail = document.getElementById('catalog-detail');
        if (!newSidebar || !newDetail || !oldSidebar || !oldDetail) {
          window.location.assign(url);
          return;
        }
        oldSidebar.replaceChildren(...newSidebar.childNodes);
        oldDetail.replaceChildren(...newDetail.childNodes);
        // Title (helps the tab strip stay accurate)
        const newTitle = doc.querySelector('title');
        if (newTitle) document.title = newTitle.textContent;
        if (push) history.pushState({pydata: true}, '', url);
        // Run any <script> tags that came back in the swap (notably
        // the chart-render and edit-code blocks). innerHTML doesn't
        // execute them; we re-create + replace to trigger execution.
        oldDetail.querySelectorAll('script').forEach((s) => {
          const repl = document.createElement('script');
          for (const a of s.attributes) repl.setAttribute(a.name, a.value);
          repl.textContent = s.textContent;
          s.parentNode.replaceChild(repl, s);
        });
      } catch (e) {
        window.location.assign(url);
      }
    }

    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      // Modifier keys / new tab / external → leave alone.
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (a.target && a.target !== '_self') return;
      const href = a.getAttribute('href');
      if (!href) return;
      // Only handle in-app same-origin links that hit one of the
      // swap-equipped routes.
      const u = new URL(href, window.location.origin);
      if (u.origin !== window.location.origin) return;
      if (!(/^\/catalog($|\/)|^\/errors\//.test(u.pathname))) return;
      e.preventDefault();
      spaNavigate(u.pathname + u.search, true);
    });
    window.addEventListener('popstate', () => {
      spaNavigate(window.location.pathname + window.location.search, false);
    });
  </script>
</body>
</html>
